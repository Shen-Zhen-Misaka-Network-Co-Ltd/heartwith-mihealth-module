name: Release

on:
  push:
    tags:
      - 'mihealth-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/checkout@v4
        with:
          repository: Shen-Zhen-Misaka-Network-Co-Ltd/heartwith-android-uploader
          path: heartwith-android-uploader
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Restore release signing key
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$HEARTWITH_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
        env:
          HEARTWITH_RELEASE_KEYSTORE_BASE64: ${{ secrets.HEARTWITH_RELEASE_KEYSTORE_BASE64 }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Show uploader SDK revision
        run: git -C heartwith-android-uploader log -1 --oneline

      - name: Build APK
        run: ./gradlew :heartwith-mihealth-lsp:assembleRelease --warning-mode=fail

      - name: Generate release notes
        run: |
          set -euo pipefail

          current_tag="${GITHUB_REF_NAME}"
          previous_tag="$(git describe --tags --match 'mihealth-v*' --abbrev=0 "${current_tag}^" 2>/dev/null || true)"
          previous_tag_date=""
          if [ -n "$previous_tag" ]; then
            previous_tag_date="$(git log -1 --format=%cI "$previous_tag")"
          fi
          uploader_head="$(git -C heartwith-android-uploader rev-parse --short HEAD)"

          {
            echo "## 变更记录"
            echo
            if [ -n "$previous_tag" ]; then
              echo "从 \`$previous_tag\` 到 \`$current_tag\` 的提交："
              echo
              git log --reverse --pretty=format:'- %s (%h)' "$previous_tag..$current_tag"
              echo
              echo
              echo "[查看完整对比](https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${current_tag})"
            else
              echo "首次发布，包含当前 tag 可达的提交："
              echo
              git log --reverse --pretty=format:'- %s (%h)' "$current_tag"
            fi

            echo
            echo "## 上传 SDK 变更"
            echo
            if [ -n "$previous_tag_date" ]; then
              uploader_changes="$(git -C heartwith-android-uploader log --since="$previous_tag_date" --reverse --pretty=format:'- %s (%h)' || true)"
              if [ -n "$uploader_changes" ]; then
                printf '%s\n' "$uploader_changes"
              else
                echo "- 本次没有新的上传 SDK 提交"
              fi
            else
              git -C heartwith-android-uploader log --max-count=10 --reverse --pretty=format:'- %s (%h)'
              echo
            fi
            echo
            echo "本次构建使用上传 SDK：\`$uploader_head\`"

            echo
            echo "## 安装包"
            echo
            echo "下载下方 APK 文件安装。"
          } > release-notes.md

          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: clients/heartwith-mihealth-lsp/build/outputs/apk/release/Heartwith-*-release.apk
          body_path: release-notes.md
